<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard — CivicFix</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" data-title="Dashboard"></header>
      <main class="admin-content">
        <div id="admin-stats" class="stats-grid"></div>

        <div class="chart-grid" style="margin-bottom: 1.5rem;">
          <div class="chart-card">
            <h3>Status Breakdown</h3>
            <div class="canvas-wrap"><canvas id="chart-status"></canvas></div>
          </div>
          <div class="chart-card">
            <h3>Top Categories</h3>
            <div class="canvas-wrap"><canvas id="chart-category"></canvas></div>
          </div>
        </div>

        <div class="chart-grid">
          <div class="chart-card">
            <h3>Recent Users</h3>
            <div id="recent-users"><div class="loading-block"><span class="spinner"></span></div></div>
          </div>
          <div class="chart-card">
            <h3>Recent Issues</h3>
            <div id="recent-issues"><div class="loading-block"><span class="spinner"></span></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/admin-js/admin-api.js"></script>
  <script src="/admin-js/admin-layout.js"></script>
  <script src="/admin-js/dashboard.js"></script>
</body>
</html>
