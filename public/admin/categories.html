<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Categories — CivicFix</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" data-title="Category Management"></header>
      <main class="admin-content">
        <div class="section-header">
          <h2>Categories</h2>
          <button class="btn btn-primary" id="btn-new">+ New Category</button>
        </div>
        <div id="cat-table"><div class="loading-block"><span class="spinner"></span>Loading…</div></div>
      </main>
    </div>
  </div>

  <div class="modal-backdrop" id="cat-modal">
    <div class="modal">
      <div class="modal-header" id="cat-modal-title">New Category</div>
      <form id="cat-form">
        <input type="hidden" id="cat-id">
        <div class="form-group">
          <label class="form-label">Name <span class="required">*</span></label>
          <input class="form-input" id="cat-name" required maxlength="60">
        </div>
        <div class="form-group">
          <label class="form-label">Slug <span class="required">*</span></label>
          <input class="form-input" id="cat-slug" required maxlength="60">
          <div class="form-help">lowercase, hyphens only — e.g. road-damage</div>
        </div>
        <div class="form-group">
          <label class="form-label">Icon (emoji)</label>
          <input class="form-input" id="cat-icon" maxlength="4" placeholder="🛣️">
        </div>
        <div class="form-group">
          <label class="form-label">Description</label>
          <textarea class="form-textarea" id="cat-desc" rows="2" maxlength="200"></textarea>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cat-cancel">Cancel</button>
          <button type="submit" class="btn btn-primary" id="cat-submit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/admin-js/admin-api.js"></script>
  <script src="/admin-js/admin-layout.js"></script>
  <script src="/admin-js/categories.js"></script>
</body>
</html>
