<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Management — CivicFix</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" data-title="User Management"></header>
      <main class="admin-content">
        <form id="user-filters" class="filters-bar" style="margin-bottom: 1rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Search</label>
            <input class="form-input" id="search" type="text" placeholder="Name or email">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Role</label>
            <select class="form-select" id="role">
              <option value="">All</option>
              <option value="resident">Resident</option>
              <option value="moderator">Moderator</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Status</label>
            <select class="form-select" id="status">
              <option value="">All</option>
              <option value="true">Active</option>
              <option value="false">Inactive</option>
            </select>
          </div>
          <button class="btn btn-primary" type="submit">Filter</button>
        </form>

        <div id="users-table"><div class="loading-block"><span class="spinner"></span>Loading…</div></div>
        <div id="pagination" class="pagination"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/admin-js/admin-api.js"></script>
  <script src="/admin-js/admin-layout.js"></script>
  <script src="/admin-js/users.js"></script>
</body>
</html>
