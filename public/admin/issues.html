<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Issue Management — CivicFix</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="/css/admin.css">
</head>
<body>
  <div class="admin-shell">
    <aside id="admin-sidebar"></aside>
    <div class="admin-main">
      <header id="admin-header" data-title="Issue Management"></header>
      <main class="admin-content">
        <form id="filters" class="filters-bar" style="margin-bottom: 1rem;">
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Search</label>
            <input class="form-input" id="keyword" type="text" placeholder="Title or reference">
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Status</label>
            <select class="form-select" id="status">
              <option value="">All</option>
              <option value="REPORTED">Reported</option>
              <option value="UNDER REVIEW">Under Review</option>
              <option value="VERIFIED">Verified</option>
              <option value="IN PROGRESS">In Progress</option>
              <option value="RESOLVED">Resolved</option>
              <option value="REJECTED">Rejected</option>
              <option value="DUPLICATE">Duplicate</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">Priority</label>
            <select class="form-select" id="priority">
              <option value="">All</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="High">High</option>
              <option value="Critical">Critical</option>
            </select>
          </div>
          <div class="form-group" style="margin-bottom:0;">
            <label class="form-label">City</label>
            <input class="form-input" id="city" type="text" placeholder="e.g. owerri">
          </div>
          <button class="btn btn-primary" type="submit">Filter</button>
        </form>

        <div id="issues-table"><div class="loading-block"><span class="spinner"></span>Loading…</div></div>
        <div id="pagination" class="pagination"></div>
      </main>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/admin-js/admin-api.js"></script>
  <script src="/admin-js/admin-layout.js"></script>
  <script src="/admin-js/issues.js"></script>
</body>
</html>
