<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — CivicFix</title>
  
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  
  <main>
    <div class="container">
      <div class="flex-between mb-4">
        <div>
          <h1>My Dashboard</h1>
          <p class="text-muted" id="welcome" style="margin: 0;">Welcome back</p>
        </div>
        <a href="/pages/report.html" class="btn btn-primary">➕ Report New Issue</a>
      </div>

      <div class="stats-grid" id="user-stats"></div>

      <div class="tabs">
        <button class="tab active" data-tab="my-issues">My Issues</button>
        <button class="tab" data-tab="followed">Followed Issues</button>
      </div>

      <div id="tab-content">
        <div class="loading-block"><span class="spinner spinner-lg"></span>Loading…</div>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
