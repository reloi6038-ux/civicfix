<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password — CivicFix</title>
  
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  
  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Reset Password</h1>
        <p class="auth-subtitle">Enter your email and we'll send you a reset link</p>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="required">*</span></label>
            <input class="form-input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
            <div class="form-error" data-error-for="email"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Send Reset Link</button>
        </form>

        <div id="dev-link-box" class="hidden mt-3" style="padding: 1rem; background: var(--primary-light); border-radius: 8px; font-size: 0.875rem;">
          <strong>Development mode:</strong> Use this link to reset:
          <br><a id="dev-link" href="#" style="word-break: break-all; font-weight: 600;"></a>
        </div>

        <p class="auth-footer"><a href="/pages/login.html">← Back to login</a></p>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    document.getElementById('forgot-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const email = document.getElementById('email').value.trim();

      document.querySelectorAll('[data-error-for]').forEach((el) => (el.textContent = ''));
      btn.disabled = true;
      btn.textContent = 'Sending…';

      try {
        const res = await api.post('/auth/forgot-password', { email });
        toast('Reset link sent if the email exists.', 'success');

        if (res.data && res.data.devResetUrl) {
          const box = document.getElementById('dev-link-box');
          const link = document.getElementById('dev-link');
          link.href = res.data.devResetUrl;
          link.textContent = res.data.devResetUrl;
          box.classList.remove('hidden');
        }
      } catch (err) {
        toast(err.message || 'Failed to send reset link', 'error');
        if (err.errors) {
          err.errors.forEach(({ field, message }) => {
            const el = document.querySelector(`[data-error-for="${field}"]`);
            if (el) el.textContent = message;
          });
        }
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
