<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — CivicFix</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Set New Password</h1>
        <p class="auth-subtitle">Choose a strong password of at least 8 characters</p>

        <div id="error-block" class="error-state hidden" style="margin-bottom: 1rem;"></div>

        <form id="reset-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="password">New Password <span class="required">*</span></label>
            <input class="form-input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password">
            <div class="form-help">At least 8 characters</div>
            <div class="form-error" data-error-for="password"></div>
          </div>
          <div class="form-group">
            <label class="form-label" for="confirm">Confirm Password <span class="required">*</span></label>
            <input class="form-input" id="confirm" name="confirm" type="password" required minlength="8" autocomplete="new-password">
            <div class="form-error" data-error-for="confirm"></div>
          </div>
          <button type="submit" class="btn btn-primary btn-block btn-lg" id="submit-btn">Reset Password</button>
        </form>

        <p class="auth-footer"><a href="/pages/login.html">← Back to login</a></p>
      </div>
    </div>
  </main>
  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const form = document.getElementById('reset-form');
    const errorBlock = document.getElementById('error-block');

    if (!token) {
      form.style.display = 'none';
      errorBlock.classList.remove('hidden');
      errorBlock.innerHTML = '<h3>Missing reset token</h3><p>The link you used is incomplete. Please request a new reset email.</p>';
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      const password = document.getElementById('password').value;
      const confirm = document.getElementById('confirm').value;

      document.querySelectorAll('[data-error-for]').forEach((el) => (el.textContent = ''));

      if (password !== confirm) {
        document.querySelector('[data-error-for="confirm"]').textContent = 'Passwords do not match';
        return;
      }
      if (password.length < 8) {
        document.querySelector('[data-error-for="password"]').textContent = 'Password must be at least 8 characters';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Resetting…';

      try {
        await api.post(`/auth/reset-password/${token}`, { password });
        toast('Password reset! Redirecting to login…', 'success');
        setTimeout(() => (window.location.href = '/pages/login.html'), 1500);
      } catch (err) {
        toast(err.message || 'Reset failed', 'error');
        errorBlock.classList.remove('hidden');
        errorBlock.innerHTML = `<h3>Reset failed</h3><p>${escapeHtml(err.message)}</p>`;
        btn.disabled = false;
        btn.textContent = 'Reset Password';
      }
    });
  </script>
</body>
</html>
