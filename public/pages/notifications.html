<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications — CivicFix</title>
  
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  
  <main>
    <div class="container" style="max-width: 800px;">
      <div class="flex-between mb-4">
        <div>
          <h1>Notifications</h1>
          <p class="text-muted" style="margin: 0;">Updates on issues you follow and report.</p>
        </div>
        <button class="btn btn-secondary btn-sm" id="mark-all-btn">Mark All as Read</button>
      </div>
      
      <div id="notifications-container">
        <div class="loading-block"><span class="spinner spinner-lg"></span>Loading…</div>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/notifications.js"></script>
</body>
</html>
