<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — CivicFix</title>
  
  
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header id="site-header"></header>
  
  <main>
    <div class="auth-wrap">
      <div class="auth-card">
        <h1 class="auth-title">Create Account</h1>
        <p class="auth-subtitle">Join your community in fixing what matters</p>
        
        <form id="register-form" novalidate>
          <div class="form-group">
            <label class="form-label" for="name">Full Name <span class="required">*</span></label>
            <input class="form-input" id="name" name="name" type="text" required maxlength="100" autocomplete="name" placeholder="John Doe">
            <div class="form-error" data-error-for="name"></div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="email">Email <span class="required">*</span></label>
            <input class="form-input" id="email" name="email" type="email" required autocomplete="email" placeholder="you@example.com">
            <div class="form-error" data-error-for="email"></div>
          </div>
          
          <div class="form-group">
            <label class="form-label" for="password">Password <span class="required">*</span></label>
            <input class="form-input" id="password" name="password" type="password" required minlength="8" autocomplete="new-password" placeholder="••••••••">
            <div class="form-help">Must be at least 8 characters long.</div>
            <div class="form-error" data-error-for="password"></div>
          </div>
          
          <button type="submit" class="btn btn-primary btn-block btn-lg mt-2" id="submit-btn">Create Account</button>
        </form>
        
        <p class="auth-footer">Already have an account? <a href="/pages/login.html">Log in</a></p>
      </div>
    </div>
  </main>
  
  <footer id="site-footer"></footer>

  <script src="/js/api.js"></script>
  <script src="/js/utils.js"></script>
  <script src="/js/layout.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
