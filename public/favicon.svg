    <!-- Pillars -->
    <rect x="24" y="40" width="10" height="38" rx="2" />
    <rect x="45" y="40" width="10" height="38" rx="2" />
    <rect x="66" y="40" width="10" height="38" rx="2" />
    <!-- Beam -->
